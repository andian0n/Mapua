<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muscle Tissue Virtual Lab</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#18212f;--mu:#5b6677;--bd:#cfd6e0;--ac:#1d5fa8;--ok:#2f8a5b;--wa:#d99a2b;--dg:#c43d3d;--rec:#1f78b4;--ctl:#7a4fb0;--eff:#b8651b;--rsp:#2f8a5b}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--card:#19202b;--tx:#e7ebf2;--mu:#9aa5b6;--bd:#2f3948;--ac:#6aa5ea;--ok:#4cc38a;--wa:#e8b04e;--dg:#ee6b6b;--rec:#5ab0e6;--ctl:#ab8ce2;--eff:#e8923f;--rsp:#4cc38a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 18px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font:600 21px Georgia,serif;margin:0 0 8px}h2{font:600 19px Georgia,serif;margin:6px 0 10px}h3{font-size:15px;margin:0 0 6px}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
#tabs button{padding:7px 12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
#tabs button[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:14px}.v[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}.ar{align-self:center;color:var(--mu)}
.box{flex:1 1 130px;border:2px solid var(--c,var(--bd));border-radius:8px;padding:6px 8px;font-size:13px;background:var(--card);transition:box-shadow .2s,background .2s;opacity:.7}
.box[data-i="1"]{--c:var(--rec)}.box[data-i="2"]{--c:var(--ctl)}.box[data-i="3"]{--c:var(--eff)}.box[data-i="4"]{--c:var(--rsp)}
.box[data-i="0"]{--c:var(--mu)}.box.done{opacity:1}
.box.on{background:var(--c);color:var(--bg);box-shadow:0 0 0 4px var(--c);opacity:1;transform:scale(1.04);animation:pl .8s ease-in-out infinite alternate}@keyframes pl{to{box-shadow:0 0 0 9px transparent}}
.now{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-weight:600}
.card .term,.card .seg{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;margin:2px}
.card .seg.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:grid;grid-template-columns:150px 1fr 250px;gap:12px;margin:12px 0}.rowp{display:grid;grid-template-columns:340px 1fr;gap:12px;margin:12px 0}
.gauge{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center;align-self:start}
.big{font:600 34px Georgia,serif}.badge{margin-top:6px;padding:3px 8px;border-radius:99px;font-size:13px;font-weight:600;border:2px solid var(--ok);color:var(--ok)}
.badge.w{border-color:var(--wa);color:var(--wa)}.badge.d{border-color:var(--dg);color:var(--dg)}
canvas{width:100%;height:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.ctl label{display:flex;flex-direction:column;font-size:13px;gap:3px;flex:1 1 190px}
select,textarea{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button.pr,.card button{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
.two{display:flex;flex-wrap:wrap;gap:10px}.two>.card{flex:1 1 300px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.chip{border:1px solid var(--bd);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--mu)}
.chip.on{border-color:var(--eff);color:var(--eff);font-weight:700;box-shadow:0 0 0 2px var(--eff)}
ol,ul{margin:4px 0;padding-left:20px}.mu{color:var(--mu)}.res{margin:8px 0;padding:0}.res p{margin:6px 0;padding:8px 12px;border-left:4px solid var(--ac);background:var(--card);border-radius:4px}
.res .good{border-color:var(--ok)}.res .bad{border-color:var(--dg)}
abbr{text-decoration:underline dotted;cursor:help}summary{cursor:pointer;font-weight:600}
textarea{width:100%;min-height:220px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}#gate[hidden]{display:none}
#gf{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px;max-width:400px;width:100%}#gf h1{font-size:22px}
#gf label{display:flex;flex-direction:column;gap:3px;margin:12px 0;font-size:14px}#gf input,#gf select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
.err{color:var(--dg);font-size:13px;min-height:20px;white-space:pre-line}
#who{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:13px;color:var(--mu);margin-top:8px}#who b{color:var(--tx)}
#who button{font:inherit;font-size:12px;padding:2px 8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;cursor:pointer}
.dv{width:100%;height:auto}.dv text{font:11px system-ui;fill:var(--mu)}
.dv .bdy *{fill:var(--tint,transparent);fill-opacity:var(--ti,0);stroke:var(--mu);stroke-width:1.5}
.dv .org{fill:var(--card);stroke:var(--eff);stroke-width:2}.dv .org.act{fill:var(--eff);animation:gl .6s ease-in-out infinite alternate}
.dv .vs{fill:none;stroke:var(--mu);stroke-width:var(--vw,3)}.dv .vs.act{fill:none;stroke:var(--eff)}
.dv .lim.act{fill:var(--eff);fill-opacity:.8;animation:shk .1s linear infinite alternate}
.dv .drp{fill:var(--rec);opacity:0;transition:opacity .3s}.dv .drp.act{opacity:1}
.dv .sen{fill:var(--card);stroke:var(--rec);stroke-width:2}.dv .sen.on{fill:var(--rec)}
.dv .ctl{fill:var(--card);stroke:var(--ctl);stroke-width:2}.dv .ctl.on{fill:var(--ctl)}
.dv .ring{fill:none;stroke-dasharray:3 3}.dv .ring.on{fill:none;stroke-width:4}
.dv .hb{transform-box:fill-box;transform-origin:center;animation:hb var(--hr,1s) ease-in-out infinite}
.dv .gd{fill:var(--wa)}.dv .fl{opacity:0;fill:none;stroke:var(--ok);stroke-width:2.5;transition:opacity .3s}.dv .fl.act{opacity:1}
.dv .dp{stroke:var(--card);stroke-width:1}.dv .drp.act .dp{animation:fall 1s linear infinite}.dv text.act{fill:var(--eff);font-weight:700}
@keyframes fall{from{transform:translateY(-3px);opacity:1}to{transform:translateY(10px);opacity:.2}}
.dv .pfo{fill:var(--ctl);opacity:0;transition:opacity .3s}
@keyframes gl{to{opacity:.55}}@keyframes shk{to{transform:translateX(2px)}}@keyframes hb{50%{transform:scale(1.14)}}
.box[data-i="5"]{--c:var(--rsp)}
.slide{width:100%;max-width:440px;height:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card);display:block;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.ctl label.cb{flex-direction:row;flex:0 0 auto;align-items:center;gap:6px}
#tip{position:fixed;z-index:30;max-width:270px;background:var(--tx);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:none;box-shadow:0 3px 10px #0005}#tip b{display:block;font-size:14px;margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 14px;border:2px solid var(--tx);border-radius:10px;background:var(--card);margin:10px 0;font-size:14px;font-weight:600}.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:16px;height:16px;border-radius:50%;border:2px solid var(--tx);display:inline-block}.legend i.sq{border-radius:3px}.legend i.ln{width:26px;height:6px;border-radius:3px;border:0}
.ftitle{font:700 21px Georgia,serif;margin:0 0 4px}
@media(max-width:700px){.row,.rowp,.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="gate"><div id="gf"><h1>Muscle Tissue Virtual Lab</h1><label>Full Name<input id="gn" autocomplete="name" maxlength="80" required></label>
<label>Group Number<select id="gg" required><option value="" disabled selected>Select Group</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
<label>Student Number<input id="gi" maxlength="20" autocomplete="off" required></label>
<div class="err" id="ge" role="alert"></div><button type="button" class="pr" id="gs">Start Lab</button></div></div>
<header hidden><h1>Muscle Tissue Virtual Lab</h1><nav id="tabs"></nav><div id="who"></div></header>
<main id="m" hidden></main>
<script>
const $=(s,e=document)=>e.querySelector(s),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const NM={sk:'Skeletal',ca:'Cardiac',sm:'Smooth'};
const gl=[['Sarcomere','The repeating contractile unit of a muscle fiber, between two Z lines'],['Actin','The thin filament that myosin heads pull on'],['Myosin','The thick filament whose heads form cross-bridges with actin'],['Troponin and Tropomyosin','Proteins on actin that block the binding sites until calcium binds troponin'],['Sarcoplasmic Reticulum','Stores calcium and releases it when the muscle is stimulated'],['Cross-Bridge','A myosin head attached to actin'],['Striations','Light and dark bands from the regular arrangement of sarcomeres'],['Intercalated Disc','A junction between cardiac cells that lets them contract as one unit'],['Sphincter','A ring of muscle that opens and closes a body passage'],['Glycogen','The stored form of glucose']];
const def=i=>{$('#gdef').innerHTML=`<p><b>${gl[i][0]}:</b> ${gl[i][1]}.</p>`};
function intro(){return `<h2>How This Lab Works</h2><div class="card"><ol><li><b>Muscle Types:</b> explore the three tissues, then identify mystery slides.</li><li><b>Sliding Filament:</b> predict, then send a nerve signal and follow each step in the sarcomere.</li><li><b>Functions:</b> pick a function, predict which tissues are involved, then watch the muscles act.</li><li>Hover over (or tap) any part of a diagram to see its label and a short definition. Mystery slides have no labels.</li><li>Your runs are recorded in the Log tab for your post-lab.</li></ol><p class="mu">This is a schematic teaching model. Timings are exaggerated so each step is easy to follow.</p></div>
<div class="card"><h3>Vocabulary: Select a Term</h3><p>${gl.map(([t],i)=>`<button class="term" onclick="def(${i})">${t}</button>`).join('')}</p><div id="gdef" class="res"><p class="mu">Select a term to see its meaning.</p></div></div>
<div class="card"><h3>Learning Objectives</h3><ul><li>List the major roles of muscle tissues</li><li>Compare how muscle types contribute to body control and function</li><li>Differentiate smooth, cardiac and skeletal muscle by microstructure and relate it to organ function</li><li>Define the sliding filament theory</li><li>Link contraction and relaxation to thermoregulation, digestion, circulation and motor function</li></ul></div>`}
/* ---------- Muscle types ---------- */
const MT={sk:{n:'Skeletal',s:'Yes',nu:'Many, at the Edge',b:'No',d:'Absent',v:'Voluntary',f:'Fast, Powerful, Tires'},ca:{n:'Cardiac',s:'Yes',nu:'One, Central',b:'Yes',d:'Present',v:'Involuntary',f:'Rhythmic, Resists Fatigue'},sm:{n:'Smooth',s:'No',nu:'One, Central',b:'No',d:'Absent',v:'Involuntary',f:'Slow, Sustained'}};
const SD='<defs><pattern id="st" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="4" height="10" style="fill:var(--bd)"/></pattern></defs>';
const STR='Striations|Light and dark bands created by the regular arrangement of sarcomeres. Skeletal and cardiac muscle have them, and smooth muscle does not.';
const tp=(t,x)=>t?` data-tip="${x}"`:'';
const nu=(x,y,rx,ry,t,x2)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" style="fill:var(--ctl)"${tp(t,x2)}/>`;
const SL={sk:t=>SD+[10,52,94,136].map((y,r)=>`<rect x="10" y="${y}" width="280" height="34" rx="6" style="fill:url(#st);stroke:var(--mu);stroke-width:2"${tp(t,STR)}/><rect x="10" y="${y}" width="280" height="34" rx="6" style="fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke"${tp(t,'Skeletal Muscle Fiber|A long, cylindrical, unbranched cell with many nuclei.')}/>`+[40,110,190,255].map((x,i)=>nu(x+(r%2)*15,y+(i%2?29:5),7,3,t,'Nucleus|Skeletal fibers have many nuclei, pushed to the edge of the cell.')).join('')).join(''),
 ca:t=>SD+[20,77,134].map(y=>`<rect x="10" y="${y}" width="280" height="26" rx="5" style="fill:url(#st);stroke:var(--mu);stroke-width:2"${tp(t,STR)}/><rect x="10" y="${y}" width="280" height="26" rx="5" style="fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke"${tp(t,'Cardiac Muscle Fiber|A striated cell that branches and links with its neighbors.')}/>`+nu(60,y+13,8,6,t,'Nucleus|Cardiac cells usually have one nucleus, near the center.')+nu(180,y+13,8,6,t,'Nucleus|Cardiac cells usually have one nucleus, near the center.')+[110,240].map(x=>`<rect x="${x}" y="${y}" width="4" height="26" style="fill:var(--dg)"${tp(t,'Intercalated Disc|A junction between cardiac cells that lets them contract as one unit.')}/>`).join('')).join('')+`<path d="M200 46L228 77M228 103L200 134M90 46L62 77M62 103L90 134" style="stroke:var(--mu);stroke-width:14;fill:none;opacity:.6"${tp(t,'Branch|Cardiac fibers branch and connect into a network.')}/>`,
 sm:t=>[0,1,2,3,4].map(r=>[0,1,2].map(c=>{const x=10+c*95+(r%2)*45,y=14+r*34;return `<path d="M${x} ${y+12}C${x+25} ${y-4} ${x+65} ${y-4} ${x+90} ${y+12}C${x+65} ${y+28} ${x+25} ${y+28} ${x} ${y+12}Z" style="fill:var(--card);stroke:var(--mu);stroke-width:2"${tp(t,'Smooth Muscle Cell|A spindle-shaped cell with no striations.')}/>`+nu(x+45,y+12,9,5,t,'Nucleus|Smooth muscle cells have one nucleus, in the center.')}).join('')).join('')};
const OG=[['Biceps (Arm)','sk','Powerful voluntary movement needs long, multinucleate striated fibers with organized sarcomeres. They contract fast and strongly but tire.'],['Heart Wall','ca','Beating for life needs fatigue resistance and coordination: branched striated fibers joined by intercalated discs contract as one unit.'],['Intestine Wall','sm','Slow, sustained, involuntary waves suit spindle-shaped cells without striations, which can stay contracted without tiring.'],['Artery Wall','sm','Vessel diameter must be adjusted slowly and continuously without conscious control, which smooth muscle does with little energy.']];
const done={},keys=Object.keys(MT),FI=['f1','f2','f3','f4','ft'];let cur=null,tries=0;
function typesView(){const sel=(id,l,o)=>`<label>${l}<select id="${id}"><option value="" disabled selected>Select</option>${o.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
return `<h2>Types of Muscle Tissue</h2>
<div class="card"><h3>1. Explore</h3><div>${keys.map(k=>`<button class="seg" onclick="ex('${k}')">${MT[k].n}</button>`).join('')}</div><svg class="slide" id="exs" viewBox="0 0 300 180" role="img" aria-label="Muscle tissue slide"><text x="150" y="95" text-anchor="middle" style="fill:var(--mu);font:14px system-ui">Select a Tissue Above</text></svg></div>
<div class="card"><h3>2. Mystery Slide <span id="mc" class="mu"></span></h3><svg class="slide" id="mys" viewBox="0 0 300 180" role="img" aria-label="Mystery muscle tissue slide"></svg>
<div class="ctl">${sel('f1','Striations',['Yes','No'])}${sel('f2','Nuclei',['One, Central','Many, at the Edge'])}${sel('f3','Branched Fibers',['Yes','No'])}${sel('f4','Intercalated Discs',['Present','Absent'])}${sel('ft','Tissue Type',['Skeletal','Cardiac','Smooth'])}</div>
<p><button class="pr" onclick="chk()">Check</button> <button class="pr" id="nx" onclick="nxt()" hidden>Next Slide</button></p><div class="res" id="mr" role="status"></div></div>
<div id="cmp" hidden><div class="card"><h3>Comparison</h3><table><tr><th></th>${keys.map(k=>`<th>${MT[k].n}</th>`).join('')}</tr>${[['Striations','s'],['Nuclei','nu'],['Branched Fibers','b'],['Intercalated Discs','d'],['Control','v'],['Contraction','f']].map(([l,p])=>`<tr><th>${l}</th>${keys.map(k=>`<td>${MT[k][p]}</td>`).join('')}</tr>`).join('')}</table><p class="mu">What do all three have in common? Add it to your log.</p></div>
<div class="card"><h3>Structure and Function</h3><label>Organ <select id="so" onchange="so()">${OG.map((o,i)=>`<option value="${i}">${o[0]}</option>`).join('')}</select></label><div id="sx" class="res"></div></div></div>`}
function ex(k){$('#exs').innerHTML=SL[k](true)}
function so(){const o=OG[+$('#so').value];$('#sx').innerHTML=`<p><b>${MT[o[1]].n} muscle.</b> ${o[2]}</p>`}
function nxt(){const left=keys.filter(k=>!done[k]);if(!left.length)return;cur=left[Math.floor(Math.random()*left.length)];tries=0;$('#mys').innerHTML=SL[cur]();$('#mr').innerHTML='';$('#nx').hidden=true;FI.forEach(i=>$('#'+i).selectedIndex=0);$('#mc').textContent=`(${Object.keys(done).length} of 3 Identified)`}
function chk(){const m=MT[cur],v=FI.map(i=>$('#'+i).value),t=[m.s,m.nu,m.b,m.d,m.n],lab=['Striations','Nuclei','Branched Fibers','Intercalated Discs','Tissue Type'];
 if(v.includes('')){$('#mr').innerHTML='<p class="bad">Answer every question first.</p>';return}
 tries++;const bad=v.map((x,i)=>x===t[i]?-1:i).filter(i=>i>=0);
 if(bad.length){$('#mr').innerHTML=`<p class="bad">Not quite. Recheck: ${bad.map(i=>lab[i]).join(', ')}.</p>`;return}
 done[cur]=1;const n=Object.keys(done).length;$('#mr').innerHTML=`<p class="good">Correct: this is ${m.n} muscle.</p>`;$('#mc').textContent=`(${n} of 3 Identified)`;lg(`Muscle Types | Identified ${m.n} | Attempts: ${tries}`);
 if(n===3){$('#cmp').hidden=false;so()}else $('#nx').hidden=false}
/* ---------- Sliding Filament ---------- */
const SS=[['Nerve Signal','A motor neuron signal travels along the muscle cell membrane.'],['Calcium Released','The sarcoplasmic reticulum releases Ca²⁺ into the fiber.'],['Calcium Binds Troponin','Ca²⁺ binds troponin, tropomyosin shifts, and the binding sites on actin are exposed.'],['Cross-Bridges Form','Myosin heads attach to the exposed sites on actin.'],['Power Stroke','Using ATP, the heads pivot and pull the thin filaments toward the center, so the sarcomere shortens.'],['Relaxation','Ca²⁺ returns to the sarcoplasmic reticulum, the heads release, and the sarcomere lengthens again.']];
const T0=[0,14,28,42,56,110],FF=(n,r)=>n<56?0:n<86?r*(n-56)/30:n<110?r:n<140?r*(1-(n-110)/30):0;
let sli,hot=[];
function slView(){const lg=[['ln','--rec','Actin (Thin Filament)'],['ln','--ctl','Myosin (Thick Filament)'],['h','--card','Myosin Head: Detached'],['','--eff','Myosin Head: Attached'],['','--wa','Calcium Ion (Ca²⁺)'],['sq','--mu','Binding Site: Blocked'],['sq','--ok','Binding Site: Exposed'],['ln','--dg','Tropomyosin'],['ln','--tx','Z Line']];
return `<h2>The Sliding Filament Theory</h2>
<div class="card"><div class="ctl"><label>Calcium Level<select id="ca"><option value="1">Normal</option><option value=".3">Low (Deficiency)</option></select></label>
<label>Predict the Contraction<select id="pc"><option value="" disabled selected>Select</option><option>Normal Strength</option><option>Weaker</option><option>No Contraction</option></select></label>
<label>Predict the First Step Affected<select id="ps"><option value="" disabled selected>Select</option>${SS.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('')}<option value="-1">No Step Is Affected</option></select></label>
<button class="pr" onclick="runSl()">Lock Prediction &amp; Send Signal</button></div></div>
<div class="now" id="nw-sl" role="status">Choose a calcium level, make your predictions, and send the signal.</div>
<div class="path" id="sp">${SS.map((s,i)=>`<div class="box" data-i="${i}"><b>Step ${i+1}</b><br>${s[0]}</div>`).join('<span class="ar">→</span>')}</div>
<div class="legend"><b>Legend:</b>${lg.map(([k,c,t])=>`<span><i class="${k}" style="background:var(${c})${k==='h'?';border-color:var(--ctl);border-width:3px':''}"></i>${t}</span>`).join('')}</div>
<canvas id="cv-sl" width="640" height="300" aria-label="Sarcomere animation. Hover over a part to see its name."></canvas>
<p class="mu">Hover over any part of the diagram to see its name and definition.</p>
<div class="card"><h3 class="ftitle">Muscle Force Over Time</h3><p class="mu">Each numbered line marks the start of a step. Force rises during the power stroke and falls during relaxation.</p><canvas id="cv-fr" width="640" height="220" aria-label="Graph of muscle force over time"></canvas></div>
<div class="res" id="rz-sl"></div>`}
function drawSl(n,r,st){const cv=$('#cv-sl'),g=cv.getContext('2d'),W=cv.width,cx=W/2,c=v=>css(v);g.clearRect(0,0,W,300);hot=[];const labs=[];
 const H=(x0,y0,x1,y1,t)=>hot.push({x0,y0,x1,y1,t}),f=FF(n,r),L=300*(1-.25*f),zl=cx-L/2,zr=cx+L/2,rl=n>110?Math.min(1,(n-110)/30):0,hit=j=>((j*37)%100)/100,TY=[120,150,180],open=st>=2&&st<=4,prog=r?f/r:0;
 g.lineCap='round';g.font='bold 15px system-ui';g.textAlign='center';g.fillStyle=c('--ac');g.fillText(st>=0?`Step ${st+1}: ${SS[st][0]}`:'Ready: Send the Signal',cx,16);g.font='bold 12px system-ui';g.lineWidth=4;g.strokeStyle=c('--mu');g.beginPath();g.moveTo(10,26);g.lineTo(110,26);g.stroke();g.fillStyle=c('--mu');g.beginPath();g.arc(116,26,7,0,7);g.fill();
 g.strokeStyle=st>=1&&st<=4?c('--wa'):c('--mu');g.beginPath();g.moveTo(110,52);g.lineTo(630,52);g.stroke();

let lv=0;function leave(){const b=$('#who button');if(!lv){lv=1;b.textContent='Click again to confirm (this clears the log)';setTimeout(()=>{lv=0;b.textContent='Change Details'},4000);return}lv=0;who=null;try{sessionStorage.removeItem('hlab-who')}catch(e){}
 $('#lg').value='';$('#gn').value='';$('#gg').selectedIndex=0;$('#gi').value='';$('#ge').textContent='';$('#gate').hidden=false;document.querySelector('header').hidden=true;$('#m').hidden=true}
function copyLog(){const t=`Name: ${who.name}\nGroup: ${who.group}\nStudent Number: ${who.id}\n\n`+$('#lg').value,m=$('#cm'),ok=()=>m.textContent='Copied.',fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let r=false;try{r=document.execCommand('copy')}catch(e){}a.remove();m.textContent=r?'Copied.':'Copy blocked. Select the log text and copy it manually.'};
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function go(){const n=$('#gn').value.trim().replace(/\s+/g,' '),g=$('#gg').value,i=$('#gi').value.trim(),e=[],bn=!/\S+ \S+/.test(n),bi=!/^20\d*$/.test(i);
 if(!n)e.push('Enter your name.');else if(bn)e.push('Not a valid full name.');
 if(!g)e.push('Choose your group.');
 if(!i)e.push('Enter your student number.');else if(bi)e.push('Not a valid student number.');
 $('#gn').setAttribute('aria-invalid',!n||bn);$('#gi').setAttribute('aria-invalid',!i||bi);$('#ge').textContent=e.join('\n');
 if(e.length)return;
 enter({name:n,group:g,id:i})}
$('#gs').onclick=go;$('#gf').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
if(who&&who.name&&who.group&&who.id)enter(who);
</script></body></html>
